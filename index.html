<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Tools - Free Image to PDF Converter</title>

<meta name="description" content="Convert JPG and PNG images to PDF online for free.">

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<header>
<h1>PDF Tools</h1>
<p>Free Online PDF Tools</p>
</header>

<div class="container">

<h2>Convert Images to PDF</h2>

<p>Select one or more images, preview them, then convert them into a PDF file.</p>

<input
type="file"
id="images"
accept="image/*"
multiple
onchange="previewImages()">

<div id="preview"></div>

<br>

<button onclick="convertPDF()">
Convert to PDF
</button>

</div>

<script src="script.js"></script>

</body>
</html>
