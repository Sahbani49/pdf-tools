<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Tools - Convert Images to PDF</title>

<meta name="description" content="Convert images to PDF online for free.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
    padding: 30px;
}

.container {
    background: white;
    max-width: 600px;
    margin: auto;
    padding: 30px;
    border-radius: 12px;
}

h1 {
    color: #222;
}

input {
    margin: 20px;
}

button {
    background: #222;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    opacity: 0.8;
}
</style>

</head>

<body>

<div class="container">

<h1>PDF Tools</h1>

<h2>Convert Images to PDF</h2>

<p>Select your images and convert them into a PDF file.</p>

<input type="file" id="images" accept="image/*" multiple>

<br>

<button onclick="convertPDF()">Convert to PDF</button>

</div>


<script>

async function convertPDF() {

const files = document.getElementById("images").files;

if(files.length === 0){
    alert("Please select images first.");
    return;
}

const { jsPDF } = window.jspdf;

let pdf = new jsPDF();

for(let i = 0; i < files.length; i++){

    let image = await readFile(files[i]);

    if(i > 0){
        pdf.addPage();
    }

    pdf.addImage(image, 'JPEG', 10, 10, 190, 270);
}

pdf.save("converted-images.pdf");

}


function readFile(file){

return new Promise((resolve)=>{

let reader = new FileReader();

reader.onload = function(e){
    resolve(e.target.result);
};

reader.readAsDataURL(file);

});

}

</script>

</body>
</html>
